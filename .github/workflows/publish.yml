name: publish

# On a tag v<x.y.z>: the base image for amd64 and arm64, as base:<x.y.z> and
# base:<x>, and each add-on as a dev-container feature, to GitHub's registry.
# The images are public: they hold tools only.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  base:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags from the version
        id: v
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "full=$v" >> "$GITHUB_OUTPUT"
          echo "major=${v%%.*}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: base
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/base:${{ steps.v.outputs.full }}
            ghcr.io/${{ github.repository }}/base:${{ steps.v.outputs.major }}

  features:
    runs-on: ubuntu-24.04
    needs: base
    steps:
      - uses: actions/checkout@v4
      - uses: devcontainers/action@v1
        with:
          publish-features: "true"
          base-path-to-features: "./features"
          features-namespace: "${{ github.repository }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
