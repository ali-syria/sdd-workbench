name: test

# T5 on both architectures for every change: the base builds, each add-on
# installs on it, every tool answers, and each image stays inside its budget.
# Then each add-on's feature metadata (test/features-metadata.py).

on:
  push:
  pull_request:

jobs:
  t5:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: T5
        run: test/run.sh --platform ${{ matrix.platform }}

  # T5 above installs every add-on's install.sh on the base and checks its
  # tools on both architectures. What only the feature's packaging says (its
  # id, version, options and an executable installer) is checked here. The
  # dev-container CLI's own `features test` wants a src/ and test/ layout of
  # its own and hung, idle, in a local trial, so it is not run.
  features:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Feature metadata
        run: python3 test/features-metadata.py
